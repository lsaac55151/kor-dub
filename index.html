    <!-- ==================== [스크립트 통합 제어] ==================== -->
    <script>
        /* -------------------- 공통 상수 · Enum · 유틸리티 -------------------- */
        const GITHUB_RAW_URL = 'https://raw.githubusercontent.com/lsaac55151/kor-dub/refs/heads/main/dub_list.json';
        const GITHUB_OPENINGS_URL = 'https://raw.githubusercontent.com/lsaac55151/kr-anime-song/refs/heads/main/list.json';

        const POSTER_FALLBACK_SVG = "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(
            `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300"><rect width="200" height="300" fill="#F0F4F8"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#64748B" font-family="sans-serif" font-size="13" font-weight="600">NO IMAGE</text></svg>`
        );
        const MEDIA_FALLBACK_SVG = "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(
            `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180"><rect width="320" height="180" fill="#F0F4F8"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#64748B" font-family="sans-serif" font-size="13" font-weight="600">NO THUMBNAIL</text></svg>`
        );

        const STATUS_ENUM = {
            all: { label: '전체', pillClass: 'pill-neutral', desc: '-' },
            active: { label: '판권 유효', pillClass: 'pill-active', desc: '국내 OTT 스트리밍 제공 중' },
            expired: { label: '판권 만료', pillClass: 'pill-expired', desc: '스트리밍 서비스 부재' },
            bddvd: { label: 'BD/DVD', pillClass: 'pill-bddvd', desc: 'BD/DVD 매체 시청' },
            vhs: { label: 'VHS', pillClass: 'pill-vhs', desc: 'VHS 비디오 매체 시청' },
            excavated: { label: '발굴 완료', pillClass: 'pill-excavated', desc: '더빙 자료 발굴 완료' }
        };

        const CATEGORY_ENUM = {
            all: '전체 구분',
            '애니': '애니메이션',
            '드라마': '외화 · 드라마',
            '영화': '외화 · 영화',
            '외화': '미분류 외화'
        };

        const CATEGORY_SHORT_ENUM = {
            '애니': '애니',
            '드라마': '드라마',
            '영화': '영화',
            '외화': '외화'
        };

        const ARTIST_ROLE_ENUM = {
            all: '전체 아티스트',
            singer: '가수',
            voice_actor: '성우'
        };

        const SONG_CATEGORY_ENUM = {
            all: '전체',
            anime_kids: '애니 (아동용)',
            anime_sub: '애니 (서브)',
            game: '게임 OST',
            drama: '드라마',
            cover: '개인 커버',
            etc: '그 외'
        };

        const CHOSUNG_LIST = ['all', 'ㄱ', 'ㄴ', 'ㄷ', 'ㄹ', 'ㅁ', 'ㅂ', 'ㅅ', 'ㅇ', 'ㅈ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ', 'A-Z', '기타'];
        const CHOSUNG_NAMES = { all: '전체', 'A-Z': 'A-Z', '기타': '기타' };

        let currentMainTab = 'rights';
        let gridDensity = 'compact'; // 'compact' (5열) | 'relaxed' (3열)

        let itemData = [];
        let currentStatus = 'all';
        let currentChosung = 'all';
        let currentPage = 1;
        const itemsPerPage = 45; // 3열(15행)과 5열(9행) 모두 빈칸 없이 딱 떨어지는 개수
        let searchTimeout = null;

        let SINGER_DATA = [];
        let SONG_DATA = [];
        let currentViewMode = 'singer';
        let currentSingerRoleFilter = 'all';
        let currentSongCatFilter = 'all';
        let openingsSearchTimeout = null;

        function escapeHtml(value = '') {
            return String(value).replace(/[&<>"']/g, (char) => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[char]));
        }

        function normalizeSearchText(value = '') {
            return String(value).toLowerCase().replace(/\s+/g, '');
        }

        function getSearchTokens(value = '') {
            return String(value)
                .toLowerCase()
                .trim()
                .replace(/([가-힣])([a-z0-9])/gi, '$1 $2')
                .replace(/([a-z0-9])([가-힣])/gi, '$1 $2')
                .split(/\s+/)
                .map(normalizeSearchText)
                .filter(Boolean);
        }

        function matchesSearchText(target, query) {
            const normalizedQuery = normalizeSearchText(query);
            if (!normalizedQuery) return true;

            const normalizedTarget = normalizeSearchText(target);
            if (normalizedTarget.includes(normalizedQuery)) return true;

            const queryTokens = getSearchTokens(query);
            return queryTokens.length > 1 && queryTokens.every(token => normalizedTarget.includes(token));
        }

        /* -------------------- 그리드 밀도 전환 (3열 / 5열) -------------------- */
        function getGridClassForDensity(density) {
            if (density === 'relaxed') {
                return 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6';
            }
            return 'grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4';
        }

        function applyGridDensityUI() {
            const pairs = [
                ['rightsDensityRelaxed', 'rightsDensityCompact'],
                ['openingsDensityRelaxed', 'openingsDensityCompact']
            ];
            pairs.forEach(([relaxedId, compactId]) => {
                const rBtn = document.getElementById(relaxedId);
                const cBtn = document.getElementById(compactId);
                if (!rBtn || !cBtn) return;

                if (gridDensity === 'relaxed') {
                    rBtn.className = 'px-2 py-1 rounded-md text-[11px] font-semibold flex items-center gap-1 cursor-pointer transition-colors duration-150 segmented-item-active';
                    cBtn.className = 'px-2 py-1 rounded-md text-[11px] font-semibold flex items-center gap-1 cursor-pointer transition-colors duration-150 segmented-item-idle';
                    rBtn.setAttribute('aria-pressed', 'true');
                    cBtn.setAttribute('aria-pressed', 'false');
                } else {
                    cBtn.className = 'px-2 py-1 rounded-md text-[11px] font-semibold flex items-center gap-1 cursor-pointer transition-colors duration-150 segmented-item-active';
                    rBtn.className = 'px-2 py-1 rounded-md text-[11px] font-semibold flex items-center gap-1 cursor-pointer transition-colors duration-150 segmented-item-idle';
                    cBtn.setAttribute('aria-pressed', 'true');
                    rBtn.setAttribute('aria-pressed', 'false');
                }
            });

            const cardGrid = document.getElementById('cardGrid');
            if (cardGrid) {
                cardGrid.className = `${getGridClassForDensity(gridDensity)} items-start min-h-[400px]`;
            }

            const galleryGrid = document.getElementById('galleryGrid');
            if (galleryGrid) {
                galleryGrid.className = getGridClassForDensity(gridDensity);
            }
        }

        function setGridDensity(density) {
            gridDensity = density === 'relaxed' ? 'relaxed' : 'compact';
            applyGridDensityUI();
            syncUrlParams();
        }

        /* -------------------- URL 쿼리 파라미터 동기화 -------------------- */
        function syncUrlParams() {
            try {
                const params = new URLSearchParams();
                if (currentMainTab !== 'rights') params.set('tab', currentMainTab);
                if (gridDensity !== 'compact') params.set('density', gridDensity);

                if (currentMainTab === 'rights') {
                    const q = (document.getElementById('searchInput')?.value || '').trim();
                    const cat = document.getElementById('categoryFilter')?.value || 'all';
                    const sort = document.getElementById('rightsSortSelect')?.value || 'title_asc';

                    if (currentStatus !== 'all') params.set('status', currentStatus);
                    if (cat !== 'all') params.set('category', cat);
                    if (currentChosung !== 'all') params.set('cho', currentChosung);
                    if (q) params.set('q', q);
                    if (sort !== 'title_asc') params.set('sort', sort);
                    if (currentPage > 1) params.set('page', String(currentPage));
                } else {
                    const oq = (document.getElementById('openingsSearchInput')?.value || '').trim();
                    const osort = document.getElementById('sortSelect')?.value || 'name';

                    if (currentViewMode !== 'singer') params.set('view', currentViewMode);
                    if (currentViewMode === 'singer' && currentSingerRoleFilter !== 'all') params.set('role', currentSingerRoleFilter);
                    if (currentViewMode === 'song' && currentSongCatFilter !== 'all') params.set('songCat', currentSongCatFilter);
                    if (oq) params.set('oq', oq);
                    if (osort !== 'name') params.set('osort', osort);
                }

                const qs = params.toString();
                const nextUrl = qs ? `${window.location.pathname}?${qs}` : window.location.pathname;
                window.history.replaceState(null, '', nextUrl);
            } catch (e) {}
        }

        function restoreStateFromUrl() {
            try {
                const params = new URLSearchParams(window.location.search);
                const tab = params.get('tab');
                const density = params.get('density');
                const status = params.get('status');
                const category = params.get('category');
                const cho = params.get('cho');
                const q = params.get('q');
                const sort = params.get('sort');
                const page = parseInt(params.get('page') || '1', 10);

                const view = params.get('view');
                const role = params.get('role');
                const songCat = params.get('songCat');
                const oq = params.get('oq');
                const osort = params.get('osort');

                if (density === 'relaxed' || density === 'compact') gridDensity = density;
                if (status && STATUS_ENUM[status]) currentStatus = status;
                if (category && CATEGORY_ENUM[category]) document.getElementById('categoryFilter').value = category;
                if (cho && CHOSUNG_LIST.includes(cho)) currentChosung = cho;
                if (q) document.getElementById('searchInput').value = q;
                if (sort && ['title_asc', 'title_desc', 'newest'].includes(sort)) document.getElementById('rightsSortSelect').value = sort;
                if (!Number.isNaN(page) && page >= 1) currentPage = page;

                if (view === 'song' || view === 'singer') currentViewMode = view;
                if (role && ARTIST_ROLE_ENUM[role]) currentSingerRoleFilter = role;
                if (songCat && SONG_CATEGORY_ENUM[songCat]) currentSongCatFilter = songCat;
                if (oq) document.getElementById('openingsSearchInput').value = oq;
                if (osort && ['name', 'newest'].includes(osort)) document.getElementById('sortSelect').value = osort;

                if (tab === 'openings') currentMainTab = 'openings';
            } catch (e) {}
        }

        /* -------------------- 전역 탭 & 모달 제어 -------------------- */
        function switchMainTab(tab, options = {}) {
            closeModal('playerModal');
            closeModal('songDetailModal');

            currentMainTab = tab === 'openings' ? 'openings' : 'rights';

            const rightsPane = document.getElementById('mainPaneRights');
            const openingsPane = document.getElementById('mainPaneOpenings');
            const rightsBtn = document.getElementById('mainTabRights');
            const openingsBtn = document.getElementById('mainTabOpenings');

            if (currentMainTab === 'rights') {
                rightsPane.classList.remove('hidden');
                openingsPane.classList.add('hidden');
                rightsBtn.className = 'px-4 py-1.5 text-xs font-semibold rounded-lg transition-all duration-150 cursor-pointer segmented-item-active';
                openingsBtn.className = 'px-4 py-1.5 text-xs font-semibold rounded-lg transition-all duration-150 cursor-pointer segmented-item-idle';
            } else {
                rightsPane.classList.add('hidden');
                openingsPane.classList.remove('hidden');
                openingsBtn.className = 'px-4 py-1.5 text-xs font-semibold rounded-lg transition-all duration-150 cursor-pointer segmented-item-active';
                rightsBtn.className = 'px-4 py-1.5 text-xs font-semibold rounded-lg transition-all duration-150 cursor-pointer segmented-item-idle';

                updateOpeningsViewModeUI();
                renderOpeningsCategoryChips();
                if (SINGER_DATA.length === 0) {
                    fetchGitHubOpeningsData();
                } else {
                    renderCurrentView();
                }
            }

            if (!options.skipUrlSync) syncUrlParams();
        }

        function stopSongDetailVideo() {
            const wrapper = document.getElementById('songDetailThumbWrapper');
            if (wrapper) wrapper.innerHTML = '';
        }

        function closeModal(modalId) {
            const modal = document.getElementById(modalId);
            if (!modal) return;

            modal.classList.add('hidden');
            modal.classList.remove('flex');

            if (modalId === 'songDetailModal') stopSongDetailVideo();
            if (modalId === 'playerModal') stopSingerInlineVideos();

            const hasOpenOverlay = ['playerModal', 'songDetailModal'].some(id => {
                const el = document.getElementById(id);
                return el && !el.classList.contains('hidden');
            });

            if (!hasOpenOverlay) {
                document.body.style.overflow = '';
            }
        }

        /* ==================== [파트 1: 더빙 판권 목록 로직] ==================== */
        function debouncedSearch() {
            updateSearchClearVisibility('searchInput', 'searchClearBtn');
            if (searchTimeout) clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                resetPageAndRender();
            }, 220);
        }

        function updateSearchClearVisibility(inputId, btnId) {
            const input = document.getElementById(inputId);
            const btn = document.getElementById(btnId);
            if (!input || !btn) return;
            if (input.value.trim().length > 0) {
                btn.classList.remove('hidden');
                btn.classList.add('flex');
            } else {
                btn.classList.add('hidden');
                btn.classList.remove('flex');
            }
        }

        function clearRightsSearch() {
            document.getElementById('searchInput').value = '';
            updateSearchClearVisibility('searchInput', 'searchClearBtn');
            resetPageAndRender();
        }

        function getChosung(str) {
            if (!str) return '기타';
            const charCode = str.trim().charCodeAt(0);
            if (charCode >= 0xAC00 && charCode <= 0xD7A3) {
                const choIndex = Math.floor((charCode - 0xAC00) / 28 / 21);
                const choList = ['ㄱ', 'ㄱ', 'ㄴ', 'ㄷ', 'ㄷ', 'ㄹ', 'ㅁ', 'ㅂ', 'ㅂ', 'ㅅ', 'ㅅ', 'ㅇ', 'ㅈ', 'ㅈ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];
                return choList[choIndex];
            }
            const char = str.trim().charAt(0);
            if (['ㄱ','ㄴ','ㄷ','ㄹ','ㅁ','ㅂ','ㅅ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'].includes(char)) return char;
            if (char === 'ㄲ') return 'ㄱ';
            if (char === 'ㄸ') return 'ㄷ';
            if (char === 'ㅃ') return 'ㅂ';
            if (char === 'ㅆ') return 'ㅅ';
            if (char === 'ㅉ') return 'ㅈ';
            if (/[a-zA-Z]/.test(char)) return 'A-Z';
            return '기타';
        }

        function getAllChosungs(str) {
            if (!str) return [];
            const chosungs = [];
            for (let i = 0; i < str.length; i++) {
                const charCode = str.charCodeAt(i);
                if (charCode >= 0xAC00 && charCode <= 0xD7A3) {
                    const choIndex = Math.floor((charCode - 0xAC00) / 28 / 21);
                    const choList = ['ㄱ', 'ㄱ', 'ㄴ', 'ㄷ', 'ㄷ', 'ㄹ', 'ㅁ', 'ㅂ', 'ㅂ', 'ㅅ', 'ㅅ', 'ㅇ', 'ㅈ', 'ㅈ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];
                    chosungs.push(choList[choIndex]);
                } else {
                    const char = str.charAt(i);
                    if (['ㄱ','ㄴ','ㄷ','ㄹ','ㅁ','ㅂ','ㅅ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'].includes(char)) chosungs.push(char);
                    else if (char === 'ㄲ') chosungs.push('ㄱ');
                    else if (char === 'ㄸ') chosungs.push('ㄷ');
                    else if (char === 'ㅃ') chosungs.push('ㅂ');
                    else if (char === 'ㅆ') chosungs.push('ㅅ');
                    else if (char === 'ㅉ') chosungs.push('ㅈ');
                }
            }
            return chosungs;
        }

        function renderChosungStrip() {
            const container = document.getElementById('chosungStrip');
            if (!container) return;
            container.innerHTML = '';

            CHOSUNG_LIST.forEach(cho => {
                const label = CHOSUNG_NAMES[cho] || cho;
                const button = document.createElement('button');
                button.type = 'button';
                button.onclick = () => {
                    currentChosung = cho;
                    renderChosungStrip();
                    resetPageAndRender();
                };
                button.innerText = label;
                if (currentChosung === cho) {
                    button.className = 'px-2 py-1 rounded-md text-[11px] font-semibold chip-active cursor-pointer shrink-0 transition-colors duration-150';
                } else {
                    button.className = 'px-2 py-1 rounded-md text-[11px] font-medium chip-base cursor-pointer shrink-0';
                }
                container.appendChild(button);
            });
        }

        function updateStatusTabsUI() {
            ['all', 'active', 'expired', 'bddvd', 'vhs', 'excavated'].forEach(s => {
                const tab = document.getElementById(`tab-${s}`);
                if (!tab) return;
                if (s === currentStatus) {
                    tab.className = 'chip-active px-2.5 py-1 rounded-lg text-xs font-semibold cursor-pointer shrink-0 flex items-center gap-1.5 transition-colors duration-150';
                } else {
                    tab.className = 'chip-base px-2.5 py-1 rounded-lg text-xs font-semibold cursor-pointer shrink-0 flex items-center gap-1.5';
                }
            });
        }

        async function fetchData() {
            try {
                const cacheBuster = `?t=${Date.now()}`;
                const response = await fetch(GITHUB_RAW_URL + cacheBuster);
                if (!response.ok) throw new Error('네트워크 응답 문제');
                const rawData = await response.json();
                itemData = rawData.map(item => ({
                    ...item,
                    _searchTitle: (item.title || item.name || '').toLowerCase().replace(/\s+/g, '')
                }));
            } catch (error) {
                console.log('데이터 로드 실패 - 빈 배열로 시작합니다.');
                itemData = [];
            } finally {
                document.getElementById('loading').classList.add('hidden');
                renderChosungStrip();
                updateStatusTabsUI();
                updateDataState({ preservePage: true });
            }
        }

        function updateStats() {
            const total = itemData.length;
            const active = itemData.filter(item => item.status === 'active').length;
            const expired = itemData.filter(item => item.status === 'expired').length;
            const bddvd = itemData.filter(item => item.status === 'bddvd').length;
            const vhs = itemData.filter(item => item.status === 'vhs').length;
            const excavated = itemData.filter(item => item.status !== 'active' && item.isExcavated).length;

            document.getElementById('statTotal').innerText = total.toLocaleString();
            document.getElementById('statActive').innerText = active.toLocaleString();
            document.getElementById('statExpired').innerText = expired.toLocaleString();
            document.getElementById('statBddvd').innerText = bddvd.toLocaleString();
            document.getElementById('statVhs').innerText = vhs.toLocaleString();
            document.getElementById('statExcavated').innerText = excavated.toLocaleString();
        }

        function updateDataState(options = {}) {
            updateStats();
            renderData(options);
        }

        function filterStatus(status) {
            currentStatus = status;
            updateStatusTabsUI();
            resetPageAndRender();
        }

        function resetPageAndRender() {
            currentPage = 1;
            renderData();
        }

        function resetRightsFilters() {
            currentStatus = 'all';
            currentChosung = 'all';
            document.getElementById('categoryFilter').value = 'all';
            document.getElementById('searchInput').value = '';
            document.getElementById('rightsSortSelect').value = 'title_asc';
            updateSearchClearVisibility('searchInput', 'searchClearBtn');
            updateStatusTabsUI();
            renderChosungStrip();
            resetPageAndRender();
        }

        function renderRightsFilterSummary(totalFiltered, rawSearchQuery, categoryFilter) {
            const badgesContainer = document.getElementById('rightsFilterBadges');
            const resetBtn = document.getElementById('rightsResetBtn');
            if (!badgesContainer || !resetBtn) return;

            const activeConditions = [];

            if (currentStatus !== 'all') {
                activeConditions.push({
                    label: `상태: ${STATUS_ENUM[currentStatus]?.label || currentStatus}`,
                    clear: () => filterStatus('all')
                });
            }
            if (categoryFilter !== 'all') {
                activeConditions.push({
                    label: `구분: ${CATEGORY_ENUM[categoryFilter] || categoryFilter}`,
                    clear: () => {
                        document.getElementById('categoryFilter').value = 'all';
                        resetPageAndRender();
                    }
                });
            }
            if (currentChosung !== 'all') {
                activeConditions.push({
                    label: `초성: ${CHOSUNG_NAMES[currentChosung] || currentChosung}`,
                    clear: () => {
                        currentChosung = 'all';
                        renderChosungStrip();
                        resetPageAndRender();
                    }
                });
            }
            if (rawSearchQuery) {
                activeConditions.push({
                    label: `검색: "${rawSearchQuery}"`,
                    clear: () => clearRightsSearch()
                });
            }

            badgesContainer.innerHTML = '';

            const countSpan = document.createElement('span');
            countSpan.className = 'text-xs font-semibold text-[var(--text-secondary)] tabular-nums mr-1';
            countSpan.textContent = `검색 결과 ${totalFiltered.toLocaleString()}건`;
            badgesContainer.appendChild(countSpan);

            activeConditions.forEach(cond => {
                const pill = document.createElement('button');
                pill.type = 'button';
                pill.className = 'inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-[11px] font-semibold bg-[var(--accent-soft)] text-[var(--accent-text)] hover:opacity-80 cursor-pointer transition-opacity';
                pill.innerHTML = `<span>${escapeHtml(cond.label)}</span><i class="ph ph-x text-[10px]"></i>`;
                pill.title = '이 조건 해제';
                pill.onclick = cond.clear;
                badgesContainer.appendChild(pill);
            });

            if (activeConditions.length > 0) {
                resetBtn.classList.remove('hidden');
                resetBtn.classList.add('inline-flex');
            } else {
                resetBtn.classList.add('hidden');
                resetBtn.classList.remove('inline-flex');
            }
        }

        function renderData() {
            const rawSearchQuery = document.getElementById('searchInput').value.trim();
            const categoryFilter = document.getElementById('categoryFilter').value;
            const sortBy = document.getElementById('rightsSortSelect').value;
            const grid = document.getElementById('cardGrid');

            updateSearchClearVisibility('searchInput', 'searchClearBtn');

            let filtered = itemData.filter(item => {
                const matchesStatus = (
                    currentStatus === 'all' ||
                    (currentStatus === 'excavated' ? (item.status !== 'active' && item.isExcavated) : item.status === currentStatus)
                );
                const matchesCategory = (categoryFilter === 'all' || item.category === categoryFilter);
                const matchesSearch = matchesSearchText(item.title || item.name, rawSearchQuery);

                let matchesChosung = false;
                if (currentChosung === 'all') {
                    matchesChosung = true;
                } else if (currentChosung === 'A-Z') {
                    matchesChosung = getChosung(item.title) === 'A-Z';
                } else if (currentChosung === '기타') {
                    matchesChosung = getChosung(item.title) === '기타';
                } else {
                    const firstCho = getChosung(item.title);
                    const allChos = getAllChosungs(item.title);
                    matchesChosung = (firstCho === currentChosung || allChos.includes(currentChosung));
                }

                return matchesStatus && matchesCategory && matchesChosung && matchesSearch;
            });

            // 정렬 적용
            filtered.sort((a, b) => {
                if (sortBy === 'newest') {
                    return (Number(b.id) || 0) - (Number(a.id) || 0);
                }
                if (currentChosung !== 'all' && currentChosung !== 'A-Z' && currentChosung !== '기타' && sortBy === 'title_asc') {
                    const aFirst = getChosung(a.title) === currentChosung;
                    const bFirst = getChosung(b.title) === currentChosung;
                    if (aFirst && !bFirst) return -1;
                    if (!aFirst && bFirst) return 1;
                }
                const cmp = (a.title || '').localeCompare(b.title || '', 'ko');
                return sortBy === 'title_desc' ? -cmp : cmp;
            });

            const totalItems = filtered.length;
            const totalPages = Math.max(1, Math.ceil(totalItems / itemsPerPage));
            if (currentPage > totalPages) currentPage = totalPages;

            renderRightsFilterSummary(totalItems, rawSearchQuery, categoryFilter);
            syncUrlParams();

            if (totalItems === 0) {
                grid.innerHTML = `
                    <div class="col-span-full surface-card rounded-xl p-10 text-left flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                        <div>
                            <p class="text-sm font-semibold text-[var(--text-primary)]">조건에 일치하는 작품이 없습니다.</p>
                            <p class="text-xs text-[var(--text-muted)] mt-1">검색어나 필터 조건을 완화해 다시 확인해보세요.</p>
                        </div>
                        <button type="button" onclick="resetRightsFilters()" class="px-3.5 py-2 rounded-lg text-xs font-semibold chip-active cursor-pointer w-fit shrink-0 transition-opacity hover:opacity-85">
                            필터 초기화
                        </button>
                    </div>
                `;
                document.getElementById('pagination').innerHTML = '';
                return;
            }

            const startIndex = (currentPage - 1) * itemsPerPage;
            const pageItems = filtered.slice(startIndex, startIndex + itemsPerPage);

            const fragment = document.createDocumentFragment();
            pageItems.forEach(item => {
                const card = document.createElement('article');
                card.className = 'content-vis-auto surface-card hover:border-[var(--border-strong)] rounded-xl overflow-hidden flex flex-col animate-card-in text-left';

                const safeTitle = escapeHtml(item.title || item.name || '제목 없음');
                const imgUrl = escapeHtml(item.thumbnail || POSTER_FALLBACK_SVG);
                const statusInfo = STATUS_ENUM[item.status] || STATUS_ENUM.expired;
                const categoryShort = escapeHtml(CATEGORY_SHORT_ENUM[item.category] || '미분류');

                const statusPill = `<span class="pill-badge ${statusInfo.pillClass}">${escapeHtml(statusInfo.label)}</span>`;
                const excavatedPill = (item.status !== 'active' && item.isExcavated)
                    ? `<span class="pill-badge pill-excavated">발굴</span>`
                    : '';
                const categoryPill = `<span class="pill-badge pill-neutral">${categoryShort}</span>`;

                let ottHtml = '';
                if (item.status === 'active') {
                    const links = Array.isArray(item.ottLinks) ? item.ottLinks : [];
                    if (links.length > 0) {
                        const ottLinksHtml = links.map(link => {
                            const isLong = (link.name || '').length > 5;
                            const gridSpan = isLong ? 'col-span-2' : 'col-span-1';
                            return `
                                <a href="${escapeHtml(link.url)}" target="_blank" rel="noopener noreferrer" class="${gridSpan} ott-link-btn px-2.5 py-1.5 rounded-lg text-[11px] font-semibold text-center block break-words leading-snug">
                                    ${escapeHtml(link.name || '바로가기')} ↗
                                </a>
                            `;
                        }).join('');
                        ottHtml = `<div class="grid grid-cols-2 gap-1.5 min-w-0">${ottLinksHtml}</div>`;
                    } else {
                        ottHtml = `<div class="text-[11px] font-medium text-[var(--text-muted)] px-2.5 py-1.5 rounded-lg" style="background-color: var(--bg-subtle);">-</div>`;
                    }
                } else {
                    const statusTextColor = {
                        bddvd: 'var(--badge-bddvd-fg)',
                        vhs: 'var(--badge-vhs-fg)',
                        expired: 'var(--badge-expired-fg)'
                    }[item.status] || 'var(--text-secondary)';
                    ottHtml = `
                        <div class="text-[11px] font-semibold px-2.5 py-1.5 rounded-lg text-left" style="background-color: var(--bg-subtle); color: ${statusTextColor};">
                            ${escapeHtml(statusInfo.desc)}
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div>
                        <div class="p-2.5 pb-0">
                            <div class="relative aspect-[2/3] w-full rounded-lg overflow-hidden img-frame">
                                <img src="${imgUrl}" loading="lazy" decoding="async" alt="${safeTitle}" class="object-cover w-full h-full opacity-100" onerror="if(!this.dataset.fb){this.dataset.fb='1';this.src='${POSTER_FALLBACK_SVG}';}">
                            </div>
                        </div>
                        <div class="p-3 pt-2.5 pb-2 space-y-2">
                            <h3 class="font-semibold text-[var(--text-primary)] text-[13px] min-h-[2.25rem] leading-snug line-clamp-2">${safeTitle}</h3>
                            <div class="flex flex-wrap items-center gap-1">
                                ${categoryPill}
                                ${statusPill}
                                ${excavatedPill}
                            </div>
                        </div>
                    </div>
                    <div class="px-3 pb-3 pt-2 border-t border-[var(--border-subtle)]">
                        ${ottHtml}
                    </div>
                `;
                fragment.appendChild(card);
            });

            grid.innerHTML = '';
            grid.appendChild(fragment);
            renderPagination(Math.ceil(totalItems / itemsPerPage));
        }

        function renderPagination(totalPages) {
            const paginationContainer = document.getElementById('pagination');
            paginationContainer.innerHTML = '';
            if (totalPages <= 1) return;

            const groupSize = 10;
            const currentGroup = Math.ceil(currentPage / groupSize);
            const startPage = (currentGroup - 1) * groupSize + 1;
            const endPage = Math.min(currentGroup * groupSize, totalPages);

            if (currentGroup > 1) {
                paginationContainer.appendChild(createPageButton(startPage - 1, '«', false, '이전 10페이지'));
            }

            for (let i = startPage; i <= endPage; i++) {
                paginationContainer.appendChild(createPageButton(i, String(i), i === currentPage));
            }

            if (endPage < totalPages) {
                paginationContainer.appendChild(createPageButton(endPage + 1, '»', false, '다음 10페이지'));
            }
        }

        function createPageButton(page, label, isActive = false, title = '') {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.innerText = label;
            if (title) btn.title = title;
            btn.onclick = () => {
                currentPage = page;
                renderData();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            if (isActive) {
                btn.className = 'w-8 h-8 rounded-lg chip-active text-xs font-bold tabular-nums cursor-default';
            } else {
                btn.className = 'w-8 h-8 rounded-lg surface-card hover:bg-[var(--bg-hover)] text-[var(--text-secondary)] hover:text-[var(--text-primary)] text-xs font-medium tabular-nums transition-colors cursor-pointer';
            }
            return btn;
        }

        /* ==================== [파트 2: 서브컬쳐/더빙 가수 DB 로직] ==================== */
        async function forceRefreshOpenings() {
            const icon = document.getElementById('refreshIcon');
            icon.classList.add('animate-spin');
            await fetchGitHubOpeningsData();
            setTimeout(() => icon.classList.remove('animate-spin'), 400);
        }

        async function fetchGitHubOpeningsData() {
            const statusBox = document.getElementById('openingsStatusMessage');
            const gridBox = document.getElementById('galleryGrid');

            try {
                gridBox.innerHTML = '';
                statusBox.classList.remove('hidden');
                statusBox.innerHTML = `
                    <div class="flex items-center gap-2 text-[var(--text-muted)] text-xs font-medium">
                        <i class="ph ph-spinner-gap animate-spin text-base text-[var(--accent-text)]"></i>
                        <span>오프닝 데이터를 불러오는 중입니다...</span>
                    </div>
                `;

                const response = await fetch(`${GITHUB_OPENINGS_URL}?t=${Date.now()}`, { cache: 'no-store' });
                if (!response.ok) throw new Error('데이터 로드 실패');

                const rawData = await response.json();
                SINGER_DATA = rawData.map(s => {
                    if (s.works && !s.songs) {
                        return { ...s, songs: s.works.map((t, i) => ({ title: t, youtubeId: i === 0 ? (s.youtubeId || '') : '' })) };
                    }
                    return s;
                });

                processSongData();
                statusBox.classList.add('hidden');
                renderOpeningsCategoryChips();
                renderCurrentView();
            } catch (error) {
                statusBox.innerHTML = `
                    <div class="surface-card rounded-xl p-6 text-left">
                        <h3 class="text-sm font-bold text-[var(--badge-expired-fg)]">오프닝 데이터를 불러오지 못했습니다.</h3>
                        <p class="text-xs text-[var(--text-muted)] mt-1">네트워크 상태를 확인한 뒤 새로고침 버튼을 눌러주세요.</p>
                    </div>
                `;
            }
        }

        function processSongData() {
            const songMap = new Map();
            let dateCounter = Date.now();

            SINGER_DATA.forEach(singer => {
                if (!singer.songs) return;
                singer.songs.forEach(song => {
                    if (!song.title) return;
                    const uniqueKey = song.youtubeId || song.title.toLowerCase().replace(/\s/g, '');

                    if (!songMap.has(uniqueKey)) {
                        songMap.set(uniqueKey, {
                            key: uniqueKey,
                            title: song.title,
                            youtubeId: song.youtubeId,
                            category: song.category || 'etc',
                            singers: [],
                            date: dateCounter--
                        });
                    }

                    const songEntry = songMap.get(uniqueKey);
                    if (!songEntry.singers.some(s => s.id === singer.id)) {
                        songEntry.singers.push({ id: singer.id, name: singer.name, theme: singer.theme });
                    }
                });
            });

            SONG_DATA = Array.from(songMap.values());
        }

        function updateOpeningsViewModeUI() {
            const btnSinger = document.getElementById('tabSinger');
            const btnSong = document.getElementById('tabSong');
            if (!btnSinger || !btnSong) return;

            if (currentViewMode === 'singer') {
                btnSinger.className = 'px-3 py-1.5 rounded-md text-xs font-semibold cursor-pointer transition-all duration-150 segmented-item-active flex items-center gap-1.5';
                btnSong.className = 'px-3 py-1.5 rounded-md text-xs font-semibold cursor-pointer transition-all duration-150 segmented-item-idle flex items-center gap-1.5';
            } else {
                btnSong.className = 'px-3 py-1.5 rounded-md text-xs font-semibold cursor-pointer transition-all duration-150 segmented-item-active flex items-center gap-1.5';
                btnSinger.className = 'px-3 py-1.5 rounded-md text-xs font-semibold cursor-pointer transition-all duration-150 segmented-item-idle flex items-center gap-1.5';
            }
        }

        function switchViewMode(mode) {
            currentViewMode = mode === 'song' ? 'song' : 'singer';
            currentSingerRoleFilter = 'all';
            currentSongCatFilter = 'all';
            document.getElementById('openingsSearchInput').value = '';
            updateSearchClearVisibility('openingsSearchInput', 'openingsSearchClearBtn');
            updateOpeningsViewModeUI();
            renderOpeningsCategoryChips();
            renderCurrentView();
        }

        function renderOpeningsCategoryChips() {
            const container = document.getElementById('openingsCategoryChips');
            if (!container) return;
            container.innerHTML = '';

            const entries = currentViewMode === 'singer'
                ? Object.entries(ARTIST_ROLE_ENUM)
                : Object.entries(SONG_CATEGORY_ENUM);

            const activeKey = currentViewMode === 'singer' ? currentSingerRoleFilter : currentSongCatFilter;

            entries.forEach(([key, label]) => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = label;
                btn.onclick = () => {
                    if (currentViewMode === 'singer') currentSingerRoleFilter = key;
                    else currentSongCatFilter = key;
                    renderOpeningsCategoryChips();
                    renderCurrentView();
                };
                btn.className = key === activeKey
                    ? 'chip-active px-2.5 py-1 rounded-lg text-xs font-semibold cursor-pointer shrink-0 transition-colors duration-150'
                    : 'chip-base px-2.5 py-1 rounded-lg text-xs font-semibold cursor-pointer shrink-0';
                container.appendChild(btn);
            });
        }

        function onOpeningsSortChange() {
            renderCurrentView();
        }

        function clearOpeningsSearch() {
            document.getElementById('openingsSearchInput').value = '';
            updateSearchClearVisibility('openingsSearchInput', 'openingsSearchClearBtn');
            renderCurrentView();
        }

        function resetOpeningsFilters() {
            currentSingerRoleFilter = 'all';
            currentSongCatFilter = 'all';
            document.getElementById('openingsSearchInput').value = '';
            document.getElementById('sortSelect').value = 'name';
            updateSearchClearVisibility('openingsSearchInput', 'openingsSearchClearBtn');
            renderOpeningsCategoryChips();
            renderCurrentView();
        }

        function renderOpeningsFilterSummary(count, query) {
            const badgesContainer = document.getElementById('openingsFilterBadges');
            const resetBtn = document.getElementById('openingsResetBtn');
            if (!badgesContainer || !resetBtn) return;

            const activeConditions = [];

            if (currentViewMode === 'singer' && currentSingerRoleFilter !== 'all') {
                activeConditions.push({
                    label: `구분: ${ARTIST_ROLE_ENUM[currentSingerRoleFilter]}`,
                    clear: () => {
                        currentSingerRoleFilter = 'all';
                        renderOpeningsCategoryChips();
                        renderCurrentView();
                    }
                });
            }
            if (currentViewMode === 'song' && currentSongCatFilter !== 'all') {
                activeConditions.push({
                    label: `카테고리: ${SONG_CATEGORY_ENUM[currentSongCatFilter]}`,
                    clear: () => {
                        currentSongCatFilter = 'all';
                        renderOpeningsCategoryChips();
                        renderCurrentView();
                    }
                });
            }
            if (query) {
                activeConditions.push({
                    label: `검색: "${query}"`,
                    clear: () => clearOpeningsSearch()
                });
            }

            badgesContainer.innerHTML = '';
            const countSpan = document.createElement('span');
            countSpan.className = 'text-xs font-semibold text-[var(--text-secondary)] tabular-nums mr-1';
            countSpan.textContent = currentViewMode === 'singer'
                ? `아티스트 ${count.toLocaleString()}명`
                : `수록곡 ${count.toLocaleString()}곡`;
            badgesContainer.appendChild(countSpan);

            activeConditions.forEach(cond => {
                const pill = document.createElement('button');
                pill.type = 'button';
                pill.className = 'inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-[11px] font-semibold bg-[var(--accent-soft)] text-[var(--accent-text)] hover:opacity-80 cursor-pointer transition-opacity';
                pill.innerHTML = `<span>${escapeHtml(cond.label)}</span><i class="ph ph-x text-[10px]"></i>`;
                pill.title = '이 조건 해제';
                pill.onclick = cond.clear;
                badgesContainer.appendChild(pill);
            });

            if (activeConditions.length > 0) {
                resetBtn.classList.remove('hidden');
                resetBtn.classList.add('inline-flex');
            } else {
                resetBtn.classList.add('hidden');
                resetBtn.classList.remove('inline-flex');
            }
        }

        function renderCurrentView() {
            const query = document.getElementById('openingsSearchInput').value.trim();
            const sortBy = document.getElementById('sortSelect').value;
            const gridBox = document.getElementById('galleryGrid');

            updateSearchClearVisibility('openingsSearchInput', 'openingsSearchClearBtn');

            let filteredSingers = SINGER_DATA.filter(s =>
                matchesSearchText(s.name, query) ||
                (s.songs && s.songs.some(song => matchesSearchText(song.title, query)))
            );
            let filteredSongs = SONG_DATA.filter(s =>
                matchesSearchText(s.title, query) ||
                s.singers.some(singer => matchesSearchText(singer.name, query))
            );

            if (currentViewMode === 'singer' && currentSingerRoleFilter !== 'all') {
                if (currentSingerRoleFilter === 'voice_actor') {
                    filteredSingers = filteredSingers.filter(s => (s.name || '').includes('(성우)'));
                } else if (currentSingerRoleFilter === 'singer') {
                    filteredSingers = filteredSingers.filter(s => !(s.name || '').includes('(성우)'));
                }
            }

            if (currentViewMode === 'song' && currentSongCatFilter !== 'all') {
                filteredSongs = filteredSongs.filter(s => s.category === currentSongCatFilter);
            }

            document.getElementById('singerStatCount').textContent = filteredSingers.length.toLocaleString();
            document.getElementById('songStatCount').textContent = filteredSongs.length.toLocaleString();

            const activeListCount = currentViewMode === 'singer' ? filteredSingers.length : filteredSongs.length;
            renderOpeningsFilterSummary(activeListCount, query);
            syncUrlParams();

            if (activeListCount === 0 && SINGER_DATA.length > 0) {
                gridBox.innerHTML = `
                    <div class="col-span-full surface-card rounded-xl p-10 text-left flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                        <div>
                            <p class="text-sm font-semibold text-[var(--text-primary)]">조건에 일치하는 항목이 없습니다.</p>
                            <p class="text-xs text-[var(--text-muted)] mt-1">검색어나 카테고리 필터를 초기화해 확인해보세요.</p>
                        </div>
                        <button type="button" onclick="resetOpeningsFilters()" class="px-3.5 py-2 rounded-lg text-xs font-semibold chip-active cursor-pointer w-fit shrink-0 transition-opacity hover:opacity-85">
                            필터 초기화
                        </button>
                    </div>
                `;
                return;
            }

            if (currentViewMode === 'singer') {
                if (sortBy === 'name') {
                    filteredSingers.sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ko'));
                } else {
                    filteredSingers.sort((a, b) => (Number(b.date ?? b.id) || 0) - (Number(a.date ?? a.id) || 0));
                }
                gridBox.innerHTML = filteredSingers.map(createSingerCard).join('');
            } else {
                if (sortBy === 'name') {
                    filteredSongs.sort((a, b) => (a.title || '').localeCompare(b.title || '', 'ko'));
                } else {
                    filteredSongs.sort((a, b) => (Number(b.date) || 0) - (Number(a.date) || 0));
                }
                gridBox.innerHTML = filteredSongs.map(createSongCard).join('');
            }
        }

        function createSingerCard(s) {
            const firstSong = s.songs && s.songs.length > 0 ? s.songs[0] : null;
            const thumbUrl = firstSong && firstSong.youtubeId
                ? `https://img.youtube.com/vi/${escapeHtml(firstSong.youtubeId)}/hqdefault.jpg`
                : MEDIA_FALLBACK_SVG;

            const isVoiceActor = (s.name || '').includes('(성우)');
            const cleanName = escapeHtml((s.name || '이름 없음').replace('(성우)', '').trim());
            const songCount = Array.isArray(s.songs) ? s.songs.length : 0;

            // 카드 전면 3요소 제한: 1. 썸네일 / 2. 이름(제목) / 3. 핵심 상태·분류 배지(2개)
            return `
                <article role="button" tabindex="0" onclick="openSingerModal(${Number(s.id)})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openSingerModal(${Number(s.id)});}" class="group surface-card-interactive rounded-xl overflow-hidden flex flex-col cursor-pointer animate-card-in text-left">
                    <div class="p-2.5 pb-0">
                        <div class="relative aspect-video w-full rounded-lg overflow-hidden img-frame">
                            <img src="${thumbUrl}" loading="lazy" decoding="async" alt="${cleanName}" class="w-full h-full object-cover opacity-100" onerror="if(!this.dataset.fb){this.dataset.fb='1';this.src='${MEDIA_FALLBACK_SVG}';}">
                        </div>
                    </div>
                    <div class="p-3 pt-2.5 flex flex-col justify-between flex-1 gap-2.5">
                        <h3 class="text-[13px] font-semibold text-[var(--text-primary)] line-clamp-1 leading-snug">${cleanName}</h3>
                        <div class="flex flex-wrap items-center gap-1.5 mt-auto">
                            <span class="pill-badge ${isVoiceActor ? 'pill-excavated' : 'pill-neutral'}">${isVoiceActor ? '성우' : '가수'}</span>
                            <span class="pill-badge pill-neutral tabular-nums">${songCount > 0 ? `${songCount}곡` : '-'}</span>
                        </div>
                    </div>
                </article>
            `;
        }

        function createSongCard(s) {
            const thumbUrl = s.youtubeId
                ? `https://img.youtube.com/vi/${escapeHtml(s.youtubeId)}/hqdefault.jpg`
                : MEDIA_FALLBACK_SVG;

            const categoryLabel = escapeHtml(SONG_CATEGORY_ENUM[s.category] || '그 외');
            const safeTitle = escapeHtml(s.title || '제목 없음');
            const encodedKey = encodeURIComponent(s.key);

            const singerSummary = s.singers && s.singers.length > 0
                ? (s.singers.length > 1
                    ? `${escapeHtml(s.singers[0].name)} 외 ${s.singers.length - 1}`
                    : escapeHtml(s.singers[0].name))
                : '-';

            // 카드 전면 3요소 제한: 1. 썸네일 / 2. 곡명(제목) / 3. 카테고리·가수 배지(2개)
            return `
                <article role="button" tabindex="0" onclick="openSongDetailModal('${encodedKey}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openSongDetailModal('${encodedKey}');}" class="group surface-card-interactive rounded-xl overflow-hidden flex flex-col cursor-pointer animate-card-in text-left">
                    <div class="p-2.5 pb-0">
                        <div class="relative aspect-video w-full rounded-lg overflow-hidden img-frame">
                            <img src="${thumbUrl}" loading="lazy" decoding="async" alt="${safeTitle}" class="w-full h-full object-cover opacity-100" onerror="if(!this.dataset.fb){this.dataset.fb='1';this.src='${MEDIA_FALLBACK_SVG}';}">
                            ${s.youtubeId ? `
                            <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-200" style="background-color: var(--scrim-media);">
                                <div class="w-9 h-9 rounded-full flex items-center justify-center border border-white/25 text-white" style="background-color: rgba(24, 24, 27, 0.78);">
                                    <i class="ph-fill ph-play text-sm ml-0.5"></i>
                                </div>
                            </div>` : ''}
                        </div>
                    </div>
                    <div class="p-3 pt-2.5 flex flex-col justify-between flex-1 gap-2.5">
                        <h3 class="text-[13px] font-semibold text-[var(--text-primary)] line-clamp-2 leading-snug">${safeTitle}</h3>
                        <div class="flex flex-wrap items-center gap-1.5 mt-auto">
                            <span class="pill-badge pill-neutral">${categoryLabel}</span>
                            <span class="pill-badge pill-excavated max-w-[120px] truncate">${singerSummary}</span>
                        </div>
                    </div>
                </article>
            `;
        }

        let currentOpenSingerId = null;
        let currentSingerPlayingIdx = null;

        function stopSingerInlineVideos() {
            if (currentSingerPlayingIdx !== null) {
                restoreSingerThumbnail(currentSingerPlayingIdx);
                const activeCard = document.getElementById(`singerSongCard-${currentSingerPlayingIdx}`);
                if (activeCard) {
                    activeCard.style.borderColor = '';
                    activeCard.style.boxShadow = '';
                }
                currentSingerPlayingIdx = null;
            }
        }

        function restoreSingerThumbnail(idx) {
            const container = document.getElementById(`singerSongMedia-${idx}`);
            if (!container) return;
            const thumbUrl = container.dataset.thumbUrl || MEDIA_FALLBACK_SVG;
            const youtubeId = container.dataset.youtubeId || '';
            const songKey = container.dataset.songKey || '';
            const encodedKey = encodeURIComponent(songKey);

            container.innerHTML = `
                <img src="${escapeHtml(thumbUrl)}" loading="lazy" decoding="async" class="w-full h-full object-cover opacity-100" onerror="if(!this.dataset.fb){this.dataset.fb='1';this.src='${MEDIA_FALLBACK_SVG}';}">
                ${youtubeId ? `
                <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-200 cursor-pointer" style="background-color: var(--scrim-media);" onclick="playSingerSongInline(${idx})" title="임베드로 바로 재생">
                    <div class="w-10 h-10 rounded-full flex items-center justify-center border border-white/25 text-white" style="background-color: rgba(24, 24, 27, 0.78);">
                        <i class="ph-fill ph-play text-sm ml-0.5"></i>
                    </div>
                </div>
                <button type="button" onclick="event.stopPropagation(); openSongDetailModal('${encodedKey}')" class="absolute top-2 right-2 z-20 w-8 h-8 rounded-lg text-white flex items-center justify-center backdrop-blur-sm transition-opacity cursor-pointer" style="background-color: rgba(15, 17, 21, 0.65);" title="상세 모달에서 크게 보기">
                    <i class="ph ph-arrows-out-simple text-sm"></i>
                </button>
                ` : ''}
            `;
        }

        function playSingerSongInline(idx) {
            const currentSinger = SINGER_DATA.find(x => x.id === currentOpenSingerId);
            if (!currentSinger || !currentSinger.songs || !currentSinger.songs[idx]) return;
            const song = currentSinger.songs[idx];
            if (!song.youtubeId) return;

            if (currentSingerPlayingIdx !== null && currentSingerPlayingIdx !== idx) {
                stopSingerInlineVideos();
            }

            stopSongDetailVideo();

            const container = document.getElementById(`singerSongMedia-${idx}`);
            if (!container) return;

            currentSingerPlayingIdx = idx;
            const card = document.getElementById(`singerSongCard-${idx}`);
            if (card) {
                card.style.borderColor = 'var(--accent)';
                card.style.boxShadow = '0 0 0 2px var(--accent-ring)';
            }

            container.innerHTML = `
                <iframe
                    class="absolute inset-0 w-full h-full border-0"
                    src="https://www.youtube-nocookie.com/embed/${escapeHtml(song.youtubeId)}?autoplay=1&rel=0"
                    title="${escapeHtml(song.title)}"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    referrerpolicy="strict-origin-when-cross-origin"
                    allowfullscreen>
                </iframe>
            `;
        }

        function openSingerModal(id) {
            stopSingerInlineVideos();
            stopSongDetailVideo();

            const s = SINGER_DATA.find(x => x.id === id);
            if (!s) return;

            currentOpenSingerId = id;
            const isVoiceActor = (s.name || '').includes('(성우)');
            const songCount = Array.isArray(s.songs) ? s.songs.length : 0;

            document.getElementById('playerMetaPills').innerHTML = `
                <span class="pill-badge ${isVoiceActor ? 'pill-excavated' : 'pill-neutral'}">${isVoiceActor ? '성우' : '가수'}</span>
                <span class="pill-badge pill-neutral tabular-nums">수록 ${songCount}곡</span>
            `;
            document.getElementById('playerTitle').textContent = s.name || '이름 없음';
            document.getElementById('playerDesc').textContent = (s.description && s.description.trim()) ? s.description : '-';

            const songHtml = (s.songs || []).map((song, idx) => {
                const thumbUrl = song.youtubeId ? `https://img.youtube.com/vi/${song.youtubeId}/hqdefault.jpg` : MEDIA_FALLBACK_SVG;
                const songKey = song.youtubeId || (song.title || '').toLowerCase().replace(/\s/g, '');
                const encodedKey = encodeURIComponent(songKey);
                const safeTitle = escapeHtml(song.title || '제목 없음');
                const catLabel = escapeHtml(SONG_CATEGORY_ENUM[song.category] || '그 외');
                const hasVideo = Boolean(song.youtubeId);

                return `
                <div class="surface-card rounded-xl overflow-hidden group flex flex-col text-left ${hasVideo ? '' : 'opacity-75'}" id="singerSongCard-${idx}">
                    <div class="p-2.5 pb-0">
                        <div class="relative aspect-video w-full rounded-lg overflow-hidden img-frame" id="singerSongMedia-${idx}" data-thumb-url="${escapeHtml(thumbUrl)}" data-youtube-id="${escapeHtml(song.youtubeId || '')}" data-song-key="${escapeHtml(songKey)}">
                            <img src="${escapeHtml(thumbUrl)}" loading="lazy" decoding="async" alt="${safeTitle}" class="w-full h-full object-cover opacity-100" onerror="if(!this.dataset.fb){this.dataset.fb='1';this.src='${MEDIA_FALLBACK_SVG}';}">
                            ${hasVideo ? `
                            <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-200 cursor-pointer" style="background-color: var(--scrim-media);" onclick="playSingerSongInline(${idx})" title="임베드로 바로 재생">
                                <div class="w-10 h-10 rounded-full flex items-center justify-center border border-white/25 text-white" style="background-color: rgba(24, 24, 27, 0.78);">
                                    <i class="ph-fill ph-play text-sm ml-0.5"></i>
                                </div>
                            </div>
                            <button type="button" onclick="event.stopPropagation(); openSongDetailModal('${encodedKey}')" class="absolute top-2 right-2 z-20 w-8 h-8 rounded-lg text-white flex items-center justify-center backdrop-blur-sm transition-opacity cursor-pointer" style="background-color: rgba(15, 17, 21, 0.65);" title="상세 모달에서 크게 보기">
                                <i class="ph ph-arrows-out-simple text-sm"></i>
                            </button>
                            ` : ''}
                        </div>
                    </div>
                    <div class="p-3 pt-2.5 flex items-start justify-between gap-2 flex-1">
                        <div class="min-w-0 flex-1 space-y-1.5">
                            <button type="button" onclick="openSongDetailModal('${encodedKey}')" class="text-left font-semibold text-xs leading-snug line-clamp-2 text-[var(--text-primary)] hover:text-[var(--accent-text)] cursor-pointer transition-colors block w-full" title="${safeTitle}">
                                ${safeTitle}
                            </button>
                            <span class="pill-badge pill-neutral">${catLabel}</span>
                        </div>
                        ${hasVideo ? `
                        <div class="flex items-center gap-1 shrink-0">
                            <button type="button" onclick="openSongDetailModal('${encodedKey}')" class="w-7 h-7 flex items-center justify-center rounded-lg hover:bg-[var(--bg-hover)] text-[var(--text-muted)] hover:text-[var(--text-primary)] transition-colors cursor-pointer" title="상세 모달에서 크게 보기">
                                <i class="ph ph-arrows-out-simple text-xs font-bold"></i>
                            </button>
                            <a href="https://www.youtube.com/watch?v=${escapeHtml(song.youtubeId)}" target="_blank" rel="noopener noreferrer" class="w-7 h-7 flex items-center justify-center rounded-lg hover:bg-[var(--bg-hover)] text-[var(--text-muted)] hover:text-[var(--text-primary)] transition-colors cursor-pointer" title="YouTube 새 탭으로 열기" onclick="event.stopPropagation()">
                                <i class="ph ph-arrow-square-out text-xs font-bold"></i>
                            </a>
                        </div>
                        ` : ''}
                    </div>
                </div>`;
            }).join('');

            document.getElementById('songListContainer').innerHTML = songHtml || '<p class="text-xs text-[var(--text-muted)]">등록된 곡이 없습니다.</p>';
            const modal = document.getElementById('playerModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.body.style.overflow = 'hidden';
        }

        function openSongDetailModal(key) {
            const decodedKey = decodeURIComponent(key);
            const s = SONG_DATA.find(x => x.key === key || x.key === decodedKey);
            if (!s) return;

            stopSingerInlineVideos();

            document.getElementById('songDetailTitle').textContent = s.title || '제목 없음';
            document.getElementById('songDetailCategoryPill').innerHTML = `<span class="pill-badge pill-neutral">${escapeHtml(SONG_CATEGORY_ENUM[s.category] || '그 외')}</span>`;

            const thumbWrapper = document.getElementById('songDetailThumbWrapper');
            const externalBtn = document.getElementById('songDetailExternalBtn');

            if (s.youtubeId) {
                thumbWrapper.innerHTML = `
                    <iframe
                        class="w-full h-full border-0"
                        src="https://www.youtube-nocookie.com/embed/${escapeHtml(s.youtubeId)}?autoplay=1&rel=0"
                        title="${escapeHtml(s.title)}"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                        referrerpolicy="strict-origin-when-cross-origin"
                        allowfullscreen>
                    </iframe>
                `;
                if (externalBtn) {
                    externalBtn.href = `https://www.youtube.com/watch?v=${escapeHtml(s.youtubeId)}`;
                    externalBtn.classList.remove('hidden');
                    externalBtn.classList.add('flex');
                }
            } else {
                thumbWrapper.innerHTML = `
                    <div class="w-full h-full flex flex-col items-center justify-center text-[var(--text-muted)] p-6 text-center">
                        <i class="ph ph-video-camera-slash text-3xl mb-2"></i>
                        <p class="text-xs font-semibold">등록된 유튜브 영상이 없습니다.</p>
                    </div>
                `;
                if (externalBtn) {
                    externalBtn.classList.add('hidden');
                    externalBtn.classList.remove('flex');
                }
            }

            const singersHtml = (s.singers && s.singers.length > 0)
                ? s.singers.map(singer => `
                    <button type="button" onclick="closeModal('songDetailModal'); openSingerModal(${Number(singer.id)});" class="surface-card hover:border-[var(--accent)] hover:text-[var(--accent-text)] px-3.5 py-2 rounded-lg text-xs font-semibold text-[var(--text-primary)] transition-colors cursor-pointer flex items-center gap-1.5">
                        <i class="ph ph-user text-sm text-[var(--text-muted)]"></i>
                        <span>${escapeHtml(singer.name)}</span>
                    </button>
                `).join('')
                : '<span class="text-xs text-[var(--text-muted)]">-</span>';

            document.getElementById('songDetailSingers').innerHTML = singersHtml;
            const detailModal = document.getElementById('songDetailModal');
            detailModal.classList.remove('hidden');
            detailModal.classList.add('flex');
            document.body.style.overflow = 'hidden';
        }

        /* -------------------- 이벤트 바인딩 & 초기화 -------------------- */
        const playerModal = document.getElementById('playerModal');
        playerModal.addEventListener('click', (e) => { if (e.target === playerModal) closeModal('playerModal'); });

        const detailModal = document.getElementById('songDetailModal');
        detailModal.addEventListener('click', (e) => { if (e.target === detailModal) closeModal('songDetailModal'); });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                const sd = document.getElementById('songDetailModal');
                const pm = document.getElementById('playerModal');
                if (sd && !sd.classList.contains('hidden')) closeModal('songDetailModal');
                else if (pm && !pm.classList.contains('hidden')) closeModal('playerModal');
            }
        });

        document.getElementById('openingsSearchInput').addEventListener('input', () => {
            updateSearchClearVisibility('openingsSearchInput', 'openingsSearchClearBtn');
            if (openingsSearchTimeout) clearTimeout(openingsSearchTimeout);
            openingsSearchTimeout = setTimeout(() => {
                renderCurrentView();
            }, 220);
        });

        // 초기 부트스트랩
        restoreStateFromUrl();
        applyGridDensityUI();
        updateSearchClearVisibility('searchInput', 'searchClearBtn');
        updateSearchClearVisibility('openingsSearchInput', 'openingsSearchClearBtn');

        if (currentMainTab === 'openings') {
            switchMainTab('openings', { skipUrlSync: true });
        }
        fetchData();
    </script>
</body>
</html>
