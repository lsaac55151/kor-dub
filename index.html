<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>더빙 아카이브 &amp; 데이터베이스</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <style>
        /* =========================================================
           90-8-2 Calibrated Bright Light Color System
           Canvas: #F7F9FC (Cool Off-White) / Surface: #FFFFFF
           Accent: #2B6AD9 (Calibrated Bright Cerulean, 10% Tinted Active)
           ========================================================= */
        :root {
            --bg-canvas: #F7F9FC;
            --bg-surface: #FFFFFF;
            --bg-elevated: #FFFFFF;
            --bg-subtle: #F0F4F8;
            --bg-hover: #E6ECF3;
            --control-bar-bg: rgba(247, 249, 252, 0.9);

            --text-primary: #141923;
            --text-secondary: #475569;
            --text-muted: #64748B;

            --border-subtle: rgba(15, 23, 42, 0.08);
            --border-strong: rgba(15, 23, 42, 0.18);
            --img-border: rgba(15, 23, 42, 0.08);

            /* Single Calibrated Bright Accent (2% Budget, 10% Tinted Fill) */
            --accent: #2B6AD9;
            --accent-hover: #2258BA;
            --accent-fg: #FFFFFF;
            --accent-soft: rgba(43, 106, 217, 0.10);
            --accent-border: rgba(43, 106, 217, 0.24);
            --accent-text: #1E50B5;
            --accent-ring: rgba(43, 106, 217, 0.22);

            --scrim-backdrop: rgba(15, 23, 42, 0.42);
            --scrim-media: rgba(15, 23, 42, 0.54);

            /* Semantic Data Tokens (10% Bg / 20% Border / High-Contrast Text) */
            --badge-active-bg: rgba(22, 163, 74, 0.10);
            --badge-active-fg: #166534;
            --badge-active-bd: rgba(22, 163, 74, 0.22);

            --badge-expired-bg: rgba(220, 38, 38, 0.09);
            --badge-expired-fg: #991B1B;
            --badge-expired-bd: rgba(220, 38, 38, 0.20);

            --badge-bddvd-bg: rgba(13, 148, 136, 0.10);
            --badge-bddvd-fg: #115E59;
            --badge-bddvd-bd: rgba(13, 148, 136, 0.22);

            --badge-vhs-bg: rgba(217, 119, 6, 0.10);
            --badge-vhs-fg: #92400E;
            --badge-vhs-bd: rgba(217, 119, 6, 0.22);

            /* Non-Status Monochrome Neutrals */
            --badge-excavated-bg: rgba(15, 23, 42, 0.065);
            --badge-excavated-fg: #1E293B;
            --badge-excavated-bd: rgba(15, 23, 42, 0.15);

            --badge-neutral-bg: rgba(15, 23, 42, 0.04);
            --badge-neutral-fg: #475569;
            --badge-neutral-bd: rgba(15, 23, 42, 0.09);
        }

        html {
            scrollbar-gutter: stable;
            color-scheme: light;
        }

        body {
            font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-canvas);
            color: var(--text-primary);
        }

        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 9999px; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .content-vis-auto {
            content-visibility: auto;
            contain-intrinsic-size: 100% 340px;
        }

        @keyframes subtleFadeIn {
            from { opacity: 0; transform: translateY(3px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-card-in {
            animation: subtleFadeIn 0.18s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Semantic Component Primitives */
        .surface-card {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            transition: border-color 0.18s ease, background-color 0.18s ease;
        }

        .surface-card-interactive {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            transition: border-color 0.18s ease, background-color 0.18s ease;
        }

        .surface-card-interactive:hover {
            border-color: var(--border-strong);
        }

        .surface-card-interactive:focus-visible {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-ring);
        }

        .img-frame {
            border: 1px solid var(--img-border);
            background-color: var(--bg-subtle);
        }

        .control-input {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            transition: border-color 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
        }

        .control-input:hover {
            border-color: var(--border-strong);
        }

        .control-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-ring);
        }

        .control-input::placeholder {
            color: var(--text-muted);
        }

        .chip-base {
            border: 1px solid transparent;
            color: var(--text-secondary);
            background-color: transparent;
            transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
        }

        .chip-base:hover {
            background-color: var(--bg-hover);
            color: var(--text-primary);
        }

        .chip-active {
            background-color: var(--accent-soft);
            color: var(--accent-text);
            border: 1px solid var(--accent-border);
        }

        .segmented-track {
            background-color: var(--bg-subtle);
            border: 1px solid var(--border-subtle);
        }

        .segmented-item-active {
            background-color: var(--bg-surface);
            color: var(--accent-text);
            border: 1px solid var(--accent-border);
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
        }

        .segmented-item-idle {
            background-color: transparent;
            color: var(--text-muted);
            border: 1px solid transparent;
        }

        .segmented-item-idle:hover {
            color: var(--text-primary);
        }

        .pill-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 11px;
            line-height: 1.2;
            font-weight: 600;
            padding: 0.22rem 0.52rem;
            border-radius: 9999px;
            border: 1px solid transparent;
            white-space: nowrap;
        }

        .pill-active { background-color: var(--badge-active-bg); color: var(--badge-active-fg); border-color: var(--badge-active-bd); }
        .pill-expired { background-color: var(--badge-expired-bg); color: var(--badge-expired-fg); border-color: var(--badge-expired-bd); }
        .pill-bddvd { background-color: var(--badge-bddvd-bg); color: var(--badge-bddvd-fg); border-color: var(--badge-bddvd-bd); }
        .pill-vhs { background-color: var(--badge-vhs-bg); color: var(--badge-vhs-fg); border-color: var(--badge-vhs-bd); }
        .pill-excavated { background-color: var(--badge-excavated-bg); color: var(--badge-excavated-fg); border-color: var(--badge-excavated-bd); }
        .pill-neutral { background-color: var(--badge-neutral-bg); color: var(--badge-neutral-fg); border-color: var(--badge-neutral-bd); }

        .ott-link-btn {
            background-color: var(--bg-surface);
            border: 1px solid rgba(15, 23, 42, 0.11);
            color: var(--text-primary);
            transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
        }

        .ott-link-btn:hover {
            background-color: var(--accent-soft);
            border-color: var(--accent-border);
            color: var(--accent-text);
        }
    </style>
</head>
<body class="min-h-screen pb-14 antialiased selection:bg-[var(--accent-soft)] selection:text-[var(--accent-text)]">

    <div class="max-w-7xl mx-auto px-4 sm:px-6">
        <!-- 상단 미니멀 헤더 -->
        <header class="pt-6 pb-4 border-b border-[var(--border-subtle)] flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
            <div class="text-left">
                <h1 class="text-lg font-bold tracking-tight text-[var(--text-primary)]">더빙 아카이브 DB</h1>
                <p class="text-xs font-medium text-[var(--text-muted)] mt-0.5">한국어 더빙 판권 목록 및 서브컬쳐·더빙 가수 데이터베이스</p>
            </div>

            <div class="flex items-center justify-start sm:justify-end">
                <!-- 통합 메인 탭 전환 -->
                <nav aria-label="메인 섹션 전환" class="segmented-track p-1 rounded-xl flex items-center gap-1">
                    <button type="button" onclick="switchMainTab('rights')" id="mainTabRights" class="px-4 py-1.5 text-xs font-semibold rounded-lg transition-all duration-150 cursor-pointer segmented-item-active">
                        더빙 판권 목록
                    </button>
                    <button type="button" onclick="switchMainTab('openings')" id="mainTabOpenings" class="px-4 py-1.5 text-xs font-semibold rounded-lg transition-all duration-150 cursor-pointer segmented-item-idle">
                        서브컬쳐/더빙 가수 DB
                    </button>
                </nav>
            </div>
        </header>

        <!-- ==================== [탭 1] 더빙 판권 목록 영역 ==================== -->
        <div id="mainPaneRights" class="block">
            <!-- 상단 슬림 고정 컨트롤 바 (1~2줄 높이 컴팩트 고정) -->
            <section aria-label="판권 목록 필터 및 정렬" class="sticky top-0 z-30 -mx-4 sm:-mx-6 px-4 sm:px-6 py-3 backdrop-blur-md border-b border-[var(--border-subtle)]" style="background-color: var(--control-bar-bg);">
                <div class="flex flex-col gap-2.5">
                    <!-- 1줄차: 검색 + 구분 + 정렬 + 그리드 밀도 토글 -->
                    <div class="flex flex-wrap items-center gap-2">
                        <div class="relative flex-1 min-w-[200px]">
                            <i class="ph ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-[var(--text-muted)] text-sm pointer-events-none"></i>
                            <input type="text" id="searchInput" oninput="debouncedSearch()" placeholder="작품명 검색..." aria-label="작품명 검색" class="control-input w-full pl-9 pr-8 py-1.5 rounded-lg text-xs font-medium">
                            <button type="button" id="searchClearBtn" onclick="clearRightsSearch()" aria-label="검색어 지우기" class="hidden absolute right-2 top-1/2 -translate-y-1/2 w-5 h-5 rounded-md text-[var(--text-muted)] hover:text-[var(--text-primary)] hover:bg-[var(--bg-hover)] items-center justify-center cursor-pointer">
                                <i class="ph ph-x text-xs"></i>
                            </button>
                        </div>

                        <div class="flex items-center gap-2 flex-wrap">
                            <select id="categoryFilter" onchange="resetPageAndRender()" aria-label="작품 구분 필터" class="control-input px-2.5 py-1.5 rounded-lg text-xs font-medium cursor-pointer">
                                <option value="all">전체 구분</option>
                                <option value="애니">애니메이션</option>
                                <option value="드라마">외화 · 드라마</option>
                                <option value="영화">외화 · 영화</option>
                                <option value="외화">미분류 외화</option>
                            </select>

                            <select id="rightsSortSelect" onchange="resetPageAndRender()" aria-label="정렬 기준" class="control-input px-2.5 py-1.5 rounded-lg text-xs font-medium cursor-pointer">
                                <option value="title_asc">가나다순</option>
                                <option value="title_desc">가나다 역순</option>
                                <option value="newest">최신 등록순</option>
                            </select>

                            <!-- 그리드 밀도 전환 토글 (3열 / 5열) -->
                            <div class="segmented-track p-0.5 rounded-lg flex items-center" role="group" aria-label="그리드 밀도 전환">
                                <button type="button" onclick="setGridDensity('relaxed')" id="rightsDensityRelaxed" title="여유 보기 (3열)" class="px-2 py-1 rounded-md text-[11px] font-semibold flex items-center gap-1 cursor-pointer transition-colors duration-150 segmented-item-idle">
                                    <i class="ph ph-squares-four text-xs"></i>
                                    <span class="hidden sm:inline">3열</span>
                                </button>
                                <button type="button" onclick="setGridDensity('compact')" id="rightsDensityCompact" title="밀집 보기 (5열)" class="px-2 py-1 rounded-md text-[11px] font-semibold flex items-center gap-1 cursor-pointer transition-colors duration-150 segmented-item-active">
                                    <i class="ph ph-grid-nine text-xs"></i>
                                    <span class="hidden sm:inline">5열</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- 2줄차: 가로형 상태 필터 칩 + 컴팩트 초성 인덱스 스트립 -->
                    <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-2">
                        <div class="flex items-center gap-1 overflow-x-auto no-scrollbar pb-0.5 lg:pb-0 shrink-0" role="tablist" aria-label="판권 상태 필터">
                            <button type="button" onclick="filterStatus('all')" id="tab-all" class="chip-base px-2.5 py-1 rounded-lg text-xs font-semibold cursor-pointer shrink-0 flex items-center gap-1.5">
                                <span>전체</span><span id="statTotal" class="text-[11px] tabular-nums opacity-75">0</span>
                            </button>
                            <button type="button" onclick="filterStatus('active')" id="tab-active" class="chip-base px-2.5 py-1 rounded-lg text-xs font-semibold cursor-pointer shrink-0 flex items-center gap-1.5">
                                <span>판권 유효</span><span id="statActive" class="text-[11px] tabular-nums opacity-75">0</span>
                            </button>
                            <button type="button" onclick="filterStatus('expired')" id="tab-expired" class="chip-base px-2.5 py-1 rounded-lg text-xs font-semibold cursor-pointer shrink-0 flex items-center gap-1.5">
                                <span>판권 만료</span><span id="statExpired" class="text-[11px] tabular-nums opacity-75">0</span>
                            </button>
                            <button type="button" onclick="filterStatus('bddvd')" id="tab-bddvd" class="chip-base px-2.5 py-1 rounded-lg text-xs font-semibold cursor-pointer shrink-0 flex items-center gap-1.5">
                                <span>BD/DVD</span><span id="statBddvd" class="text-[11px] tabular-nums opacity-75">0</span>
                            </button>
                            <button type="button" onclick="filterStatus('vhs')" id="tab-vhs" class="chip-base px-2.5 py-1 rounded-lg text-xs font-semibold cursor-pointer shrink-0 flex items-center gap-1.5">
                                <span>VHS</span><span id="statVhs" class="text-[11px] tabular-nums opacity-75">0</span>
                            </button>
                            <button type="button" onclick="filterStatus('excavated')" id="tab-excavated" class="chip-base px-2.5 py-1 rounded-lg text-xs font-semibold cursor-pointer shrink-0 flex items-center gap-1.5">
                                <span>발굴 완료</span><span id="statExcavated" class="text-[11px] tabular-nums opacity-75">0</span>
                            </button>
                        </div>

                        <div class="hidden lg:block h-4 w-px bg-[var(--border-subtle)] shrink-0"></div>

                        <!-- 가로형 초성 인덱스 스트립 (기존 좌측 사이드바 대체) -->
                        <div id="chosungStrip" class="flex items-center gap-0.5 overflow-x-auto no-scrollbar" aria-label="초성 인덱스 필터"></div>
                    </div>
                </div>
            </section>

            <!-- 활성 필터 조건 요약 및 초기화 바 -->
            <div id="rightsFilterSummary" class="mt-4 mb-4 flex flex-wrap items-center justify-between gap-2 min-h-[28px]">
                <div id="rightsFilterBadges" class="flex flex-wrap items-center gap-1.5 text-left"></div>
                <button type="button" id="rightsResetBtn" onclick="resetRightsFilters()" class="hidden px-2.5 py-1 rounded-lg text-xs font-semibold text-[var(--accent-text)] bg-[var(--accent-soft)] hover:opacity-85 transition-opacity cursor-pointer items-center gap-1 shrink-0">
                    <i class="ph ph-arrow-counter-clockwise text-xs"></i>
                    <span>필터 초기화</span>
                </button>
            </div>

            <div id="loading" class="text-left py-14 text-[var(--text-muted)] text-xs font-medium flex items-center gap-2">
                <i class="ph ph-spinner-gap animate-spin text-base text-[var(--accent-text)]"></i>
                <span>GitHub 원본 데이터를 동기화하는 중입니다...</span>
            </div>

            <div id="cardGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 items-start min-h-[400px]"></div>

            <!-- 페이지네이션 -->
            <nav id="pagination" aria-label="페이지 이동" class="mt-10 flex justify-center items-center flex-wrap gap-1.5 pb-4"></nav>
        </div>

        <!-- ==================== [탭 2] 서브컬쳐/더빙 가수 DB 영역 ==================== -->
        <div id="mainPaneOpenings" class="hidden">
            <!-- 상단 슬림 고정 컨트롤 바 -->
            <section aria-label="가수 및 곡 필터" class="sticky top-0 z-30 -mx-4 sm:-mx-6 px-4 sm:px-6 py-3 backdrop-blur-md border-b border-[var(--border-subtle)]" style="background-color: var(--control-bar-bg);">
                <div class="flex flex-col gap-2.5">
                    <!-- 1줄차: 보기 전환 + 검색 + 정렬 + 밀도 + 새로고침 -->
                    <div class="flex flex-wrap items-center gap-2">
                        <div class="segmented-track p-0.5 rounded-lg flex items-center shrink-0" role="tablist" aria-label="보기 방식 전환">
                            <button type="button" onclick="switchViewMode('singer')" id="tabSinger" class="px-3 py-1.5 rounded-md text-xs font-semibold cursor-pointer transition-all duration-150 segmented-item-active flex items-center gap-1.5">
                                <span>가수별</span>
                                <span id="singerStatCount" class="text-[11px] tabular-nums opacity-75">0</span>
                            </button>
                            <button type="button" onclick="switchViewMode('song')" id="tabSong" class="px-3 py-1.5 rounded-md text-xs font-semibold cursor-pointer transition-all duration-150 segmented-item-idle flex items-center gap-1.5">
                                <span>곡별</span>
                                <span id="songStatCount" class="text-[11px] tabular-nums opacity-75">0</span>
                            </button>
                        </div>

                        <div class="relative flex-1 min-w-[180px]">
                            <i class="ph ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-[var(--text-muted)] text-sm pointer-events-none"></i>
                            <input type="text" id="openingsSearchInput" placeholder="아티스트, 곡명 검색..." aria-label="아티스트 또는 곡명 검색" class="control-input w-full pl-9 pr-8 py-1.5 rounded-lg text-xs font-medium">
                            <button type="button" id="openingsSearchClearBtn" onclick="clearOpeningsSearch()" aria-label="검색어 지우기" class="hidden absolute right-2 top-1/2 -translate-y-1/2 w-5 h-5 rounded-md text-[var(--text-muted)] hover:text-[var(--text-primary)] hover:bg-[var(--bg-hover)] items-center justify-center cursor-pointer">
                                <i class="ph ph-x text-xs"></i>
                            </button>
                        </div>

                        <div class="flex items-center gap-2">
                            <select id="sortSelect" onchange="onOpeningsSortChange()" aria-label="정렬 기준" class="control-input px-2.5 py-1.5 rounded-lg text-xs font-medium cursor-pointer">
                                <option value="name">가나다순</option>
                                <option value="newest">최신 등록순</option>
                            </select>

                            <!-- 그리드 밀도 전환 토글 (3열 / 5열) -->
                            <div class="segmented-track p-0.5 rounded-lg flex items-center" role="group" aria-label="그리드 밀도 전환">
                                <button type="button" onclick="setGridDensity('relaxed')" id="openingsDensityRelaxed" title="여유 보기 (3열)" class="px-2 py-1 rounded-md text-[11px] font-semibold flex items-center gap-1 cursor-pointer transition-colors duration-150 segmented-item-idle">
                                    <i class="ph ph-squares-four text-xs"></i>
                                    <span class="hidden sm:inline">3열</span>
                                </button>
                                <button type="button" onclick="setGridDensity('compact')" id="openingsDensityCompact" title="밀집 보기 (5열)" class="px-2 py-1 rounded-md text-[11px] font-semibold flex items-center gap-1 cursor-pointer transition-colors duration-150 segmented-item-active">
                                    <i class="ph ph-grid-nine text-xs"></i>
                                    <span class="hidden sm:inline">5열</span>
                                </button>
                            </div>

                            <button type="button" onclick="forceRefreshOpenings()" class="w-8 h-8 surface-card hover:bg-[var(--bg-hover)] text-[var(--text-secondary)] hover:text-[var(--text-primary)] rounded-lg flex items-center justify-center transition-colors cursor-pointer shrink-0" title="최신 데이터 다시 불러오기" aria-label="최신 데이터 다시 불러오기">
                                <i id="refreshIcon" class="ph ph-arrows-clockwise text-sm"></i>
                            </button>
                        </div>
                    </div>

                    <!-- 2줄차: 가로형 카테고리 필터 칩 -->
                    <div id="openingsCategoryChips" class="flex items-center gap-1 overflow-x-auto no-scrollbar pb-0.5" role="tablist" aria-label="카테고리 필터"></div>
                </div>
            </section>

            <!-- 활성 필터 조건 요약 및 초기화 바 -->
            <div id="openingsFilterSummary" class="mt-4 mb-4 flex flex-wrap items-center justify-between gap-2 min-h-[28px]">
